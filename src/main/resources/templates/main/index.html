<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/main.css}" href="/css/main.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen market-screen" aria-labelledby="main-title">
        <header class="market-header">
            <img class="market-logo-symbol"
                 th:src="@{/images/logo.webp}"
                 src="/images/main/itcen-logo-symbol.png"
                 alt="">
            <h1 id="main-title">세니마켓</h1>
        </header>

        <form class="market-search" action="#" method="get" role="search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <label class="visually-hidden" for="keyword">검색어</label>
            <input id="keyword" name="keyword" type="search" placeholder="검색어를 입력해주세요">
        </form>

        <nav class="market-tabs" aria-label="상품 보기">
            <a class="market-tab is-active" href="#" aria-current="page">전체</a>
            <a class="market-tab" href="#">관심</a>
        </nav>

        <div class="market-list-header">
            <!-- 컨트롤러에서 전달한 전체 상품 개수를 출력한다. -->
            <span th:text="${totalCount != null ? '전체 ' + totalCount + '건' : '전체 128건'}">전체 128건</span>
            <label class="visually-hidden" for="tradeType">거래 유형</label>
            <select id="tradeType" name="tradeType" aria-label="거래 유형">
                <option value="">전체</option>
                <option value="sale">판매</option>
                <option value="share">나눔</option>
            </select>
        </div>

        <section class="listing-list" aria-label="상품 목록" th:if="${listings == null}">
            <div class="listing-card"
                 th:each="item : ${#numbers.sequence(1, 6)}">
                <a class="listing-detail-link"
                   th:href="@{/mobile/listings/detail}"
                   href="/mobile/listings/detail">
                    <img class="listing-image"
                         th:src="@{/images/main/product-macbook.png}"
                         src="/images/main/product-macbook.png"
                         alt="맥북 에어 M1 13인치">
                    <div class="listing-info">
                        <strong class="listing-title">맥북 에어 M1 13인치</strong>
                        <span class="listing-category">ITㆍ디지털</span>
                        <div class="listing-meta">
                            <span class="listing-price">900,000원</span>
                            <span class="listing-time">1시간 전</span>
                        </div>
                    </div>
                </a>
                <button type="button" class="listing-like">
                    <i class="bi bi-heart" aria-hidden="true"></i>
                    <span>3</span>
                </button>
            </div>
        </section>

        <!-- 컨트롤러에서 전달한 listings를 반복하며 실제 상품 목록을 출력한다. -->
        <section class="listing-list" aria-label="상품 목록" th:if="${listings != null}">
            <div class="listing-card"
                 th:each="listing : ${listings}">
                <a class="listing-detail-link"
                   th:href="@{/mobile/listings/detail(id=${listing.id})}">
                    <img class="listing-image"
                         th:src="${listing.image != null ? listing.image.imageUrl : '/images/main/product-macbook.png'}"
                         src="/images/main/product-macbook.png"
                         th:alt="${listing.title}"
                         alt="상품 이미지">
                    <div class="listing-info">
                        <strong class="listing-title" th:text="${listing.title}">맥북 에어 M1 13인치</strong>
                        <span class="listing-category" th:text="${listing.category.name}">ITㆍ디지털</span>
                        <div class="listing-meta">
                            <span class="listing-price" th:text="${listing.price + '원'}">900,000원</span>
                            <span class="listing-time" th:text="${#temporals.format(listing.updatedAt, 'yyyy-MM-dd')}">1시간 전</span>
                        </div>
                    </div>
                </a>
                <button type="button"
                        class="listing-like"
                        th:classappend="${listing.likedByMe} ? ' is-liked'"
                        th:aria-pressed="${listing.likedByMe}"
                        th:data-listing-id="${listing.id}">
                    <i class="bi"
                       th:classappend="${listing.likedByMe} ? ' bi-heart-fill' : ' bi-heart'"
                       aria-hidden="true"></i>
                    <span th:text="${listing.likeCount}">3</span>
                </button>
            </div>
        </section>

        <a class="listing-write-button"
           th:href="@{/mobile/listings/write}"
           href="/mobile/listings/write"
           aria-label="글쓰기">
            <i class="bi bi-plus-lg" aria-hidden="true"></i>
        </a>

        <nav th:replace="~{fragments/mobile :: bottomNav('home')}"></nav>
    </section>
</main>
<script th:src="@{/js/main.js}" src="/js/main.js"></script>
</body>
</html>
