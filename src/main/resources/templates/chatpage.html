<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>채팅방</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        #chat-content { height: 400px; overflow-y: auto; background: #f1f1f1; padding: 15px; border-radius: 5px; }
        .msg-box { margin-bottom: 10px; padding: 10px; border-radius: 10px; max-width: 80%; }
        .my-msg { background: #007bff; color: white; margin-left: auto; }
        .other-msg { background: #fff; color: #333; }
    </style>
</head>
<body>
<div class="container py-5">
    <div class="card">
        <div class="card-header bg-dark text-white">
            채팅방 ID: <span id="display-room-id" th:text="${chatRoomId}"></span>
            <!--          <input type="hidden" id="senderId" th:value="${senderId}">-->
        </div>
        <div class="card-body">
            <div id="chat-content">
            </div>
        </div>
        <div class="card-footer">
            <div class="input-group">
                <input type="text" id="message" class="form-control" placeholder="메시지를 입력하세요...">
                <button class="btn btn-primary" onclick="sendMessage()">전송</button>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    let stompClient = null;
    const roomId = [[${chatRoomId}]];
    let token = "";
    let senderEmail = "";

    function connect() {
        // WebSocketConfig에서 설정한 엔드포인트 "/connect"
        const socket = new SockJS('/connect');
        stompClient = Stomp.over(socket);
        token = localStorage.getItem("accessToken");
        senderEmail = localStorage.getItem("userEmail");

        stompClient.connect({
            Authorization: `Bearer ${token}`
        }, function (frame) {
            console.log('Connected: ' + frame);
            getMessageHistory(roomId, senderEmail);

            // 구독 설정: /topic/{roomId} 주소로 오는 메시지를 받음
            stompClient.subscribe('/topic/' + roomId, function (response) {
                const chatData = JSON.parse(response.body);
                // 서버에서 messageSendRequest.getMessage()만 보냈으므로 그대로 출력
                showMessage(chatData, senderEmail);
            });
        }, function(error) {
            console.log('STOMP error: ' + error);
        });
    }

    function sendMessage() {
        const messageContent = document.getElementById('message').value;
        if (messageContent && stompClient) {
            const chatMessage = {
                // ChatMessageSendRequest DTO 구조에 맞춰서 전송
                senderEmail: senderEmail,
                message: messageContent
            };
            // 발행 설정: /publish/{roomId} 주소로 메시지 보냄
            // WebSocketConfig의 ApplicationDestinationPrefixes("/publish")와 결합됨
            stompClient.send("/publish/" + roomId, {}, JSON.stringify(chatMessage));
            document.getElementById('message').value = '';
        }
    }

    function showMessage(chatData, senderEmail) {
        console.log("결과값1 = " + chatData);
        console.log("결과값2 = " + chatData.message);
        console.log("결과값3 = " + chatData.senderEmail);
        const chatContent = document.getElementById('chat-content');
        const myMsgDiv = document.createElement('div');
        const otherMsgDiv = document.createElement('div');
        if(senderEmail === chatData.senderEmail){
            myMsgDiv.className = 'msg-box my-msg'; // 내 메시지
            myMsgDiv.textContent = chatData.message;
            chatContent.appendChild(myMsgDiv);
        } else {
            otherMsgDiv.className = 'msg-box other-msg'; // 단순화를 위해 타인 메시지로 표시
            otherMsgDiv.textContent = chatData.message;
            chatContent.appendChild(otherMsgDiv);
        }
        chatContent.scrollTop = chatContent.scrollHeight;
    }

    function getMessageHistory(roomId, buyerEmail) {

        const data = {
            roomId: roomId
        };

        fetch(`/chat/history/${roomId}`, {
            method: 'POST', // POST 방식 사용
            headers: {
                'Content-Type': 'application/json', // JSON 데이터를 보낸다고 명시
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
                buyerEmail: buyerEmail // Body에 데이터 포함
            })
        })
            .then(response => response.json())
            .then(messages => {
                messages.forEach(message => showMessage(message, buyerEmail));
            })
            .catch(error => console.error("채팅 기록 로드 실패:", error));
    }

    // 엔터키 지원
    document.getElementById('message').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') sendMessage();
    });

    // 페이지 로드 시 연결
    connect();

    // 다른 페이지로 넘어갈 때 그 이벤트를 감지해서 disconnect
    window.addEventListener('beforeunload', (event) => {
        if(stompClient !== null && stompClient.connected){
            stompClient.disconnect();
        }
    })
</script>
</body>
</html>
