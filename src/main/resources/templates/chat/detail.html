<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이재용 - 채팅</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/chat.css}" href="/css/chat.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen chat-detail-screen" aria-labelledby="chat-partner">
        <header class="chat-detail-header">
            <a class="chat-back-button" th:href="@{/mobile/chat}" href="/mobile/chat" aria-label="채팅 목록으로 돌아가기">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </a>
            <div class="chat-detail-title">
                <h1 id="chat-partner" th:text="${myChatRoom.contactUser.name}">이재용</h1>
                <span th:text="${myChatRoom.listing.title}">갤럭시S26 Ultra 512GB</span>
            </div>
        </header>

        <time class="chat-date" datetime="2026-05-01">2026년 05월 01일</time>

        <section class="chat-message-list" aria-label="메시지 목록" th:each="chatHistory : ${chatHistories}">

            <div th:if="${chatHistory.senderEmail==myChatRoom.contactUser.email}" class="chat-message-row is-partner">
                <p th:if="${chatHistory.contentType.name == 'TEXT'}" class="chat-bubble chat-bubble-partner" th:text="${chatHistory.message}">강현님 안녕하세요.</p>
                <img th:if="${chatHistory.contentType.name == 'IMAGE'}"
                     class="chat-message-image"
                     th:src="@{${chatHistory.message}}"
                     src="/images/chat/chat-message-lee-jaeyong.png"
                     alt="채팅 이미지">
                <time class="chat-message-time" datetime="14:30">오후 2:30</time>
            </div>

            <div th:if="${chatHistory.senderEmail!=myChatRoom.contactUser.email}" class="chat-message-row is-me">
                <time class="chat-message-time" datetime="14:30">오후 2:30</time>
                <p  th:if="${chatHistory.contentType.name == 'TEXT'}" class="chat-bubble chat-bubble-me" th:text="${chatHistory.message}">재용님 안녕하세요.</p>
                <img th:if="${chatHistory.contentType.name == 'IMAGE'}"
                     class="chat-message-image"
                     th:src="@{${chatHistory.message}}"
                     src="/images/chat/chat-message-lee-jaeyong.png"
                     alt="채팅 이미지">
            </div>

        </section>

        <form class="chat-compose" action="#" method="post">
            <label class="visually-hidden" for="message">메시지 입력</label>
            <div class="chat-compose-field">
                <input id="message" name="message" type="text" placeholder="메시지를 입력하세요.">
                <button class="chat-image-button" type="button" aria-label="이미지 첨부">
                    <i class="bi bi-image" aria-hidden="true"></i>
                </button>
            </div>
            <button class="chat-send-button" type="button" aria-label="메시지 전송">
                <i class="bi bi-send" aria-hidden="true"></i>
            </button>
        </form>
    </section>
</main>
</body>
</html>
