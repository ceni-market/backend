<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <meta name="current-user-email" th:content="${userEmail}">
    <title>[[|${myChatRoom.listingInfo.title}  ${myChatRoom.contactUserInfo.name}|]]</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/chat.css}" href="/css/chat.css">
    <style>
        html, body { height: 100%; overflow: hidden; }
    </style>
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen chat-detail-screen" aria-labelledby="chat-partner">
        <header class="chat-detail-header">
            <a class="chat-back-button" th:href="@{/mobile/chat}" href="/mobile/chat" aria-label="채팅 목록으로 돌아가기">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </a>
            <div class="chat-detail-title">
                <h1 id="chat-partner" th:text="${myChatRoom.contactUserInfo.name}">이재용</h1>
                <span th:text="${myChatRoom.listingInfo.title}">갤럭시S26 Ultra 512GB</span>
            </div>
        </header>

        <div class="chat-messages-scroll">
<!--            <time class="chat-date" datetime="2026-05-01">2026년 05월 01일</time>-->

            <section th:each="chatHistory : ${chatHistories}" class="chat-message-list" aria-label="메시지 목록" >
                <div th:if="${chatHistory.senderEmail==myChatRoom.contactUserInfo.email}" class="chat-message-row is-partner">
                    <p th:if="${chatHistory.messageType.name == 'TEXT'}" class="chat-bubble chat-bubble-partner" th:text="${chatHistory.message}">강현님 안녕하세요.</p>
                    <img th:if="${chatHistory.messageType.name == 'IMAGE'}"
                         class="chat-message-image"
                         th:src="@{${chatHistory.message}}"
                         src="/images/chat/chat-message-lee-jaeyong.png"
                         alt="채팅 이미지">
                    <time class="chat-message-time" th:datetime="${chatHistory.createdAt}" th:text="${#temporals.format(chatHistory.createdAt, 'a hh:mm')}">오후 2:30</time>
                </div>
                <div th:if="${chatHistory.senderEmail!=myChatRoom.contactUserInfo.email}" class="chat-message-row is-me">
                    <time class="chat-message-time" th:datetime="${chatHistory.createdAt}" th:text="${#temporals.format(chatHistory.createdAt, 'a hh:mm')}">오후 2:30</time>
                    <p th:if="${chatHistory.messageType.name == 'TEXT'}" class="chat-bubble chat-bubble-me" th:text="${chatHistory.message}">재용님 안녕하세요.</p>
                    <img th:if="${chatHistory.messageType.name == 'IMAGE'}"
                         class="chat-message-image"
                         th:src="@{${chatHistory.message}}"
                         src="/images/chat/chat-message-lee-jaeyong.png"
                         alt="채팅 이미지">
                </div>
            </section>
        </div>

        <form class="chat-compose" action="#" method="post">
            <input id="image-file" type="file" accept="image/*" style="display:none">
            <label class="visually-hidden" for="message">메시지 입력</label>
            <div class="chat-compose-field">
                <input id="message" name="message" type="text" placeholder="메시지를 입력하세요.">
                <button class="chat-image-button" type="button" aria-label="이미지 첨부">
                    <i class="bi bi-image" aria-hidden="true"></i>
                </button>
            </div>
            <button class="chat-send-button" type="button" aria-label="메시지 전송">
                <i class="bi bi-send" aria-hidden="true"></i>
            </button>
        </form>
    </section>
</main>
<script src="/js/chat-detail.js"></script>
<th:block th:replace="~{fragments/mobile :: notification}"></th:block>
</body>
</html>
