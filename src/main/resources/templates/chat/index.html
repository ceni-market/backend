<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>채팅 - 세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/chat.css}" href="/css/chat.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen chat-screen" aria-labelledby="chat-title">
        <header class="chat-header">
            <h1 id="chat-title">채팅</h1>
        </header>

        <form class="chat-search" action="#" method="get" role="search">
            <i class="bi bi-search" aria-hidden="true"></i>
            <label class="visually-hidden" for="chatKeyword">대화방 검색</label>
            <input id="chatKeyword" name="keyword" type="search" placeholder="대화방 또는 상대방을 검색하세요">
        </form>

        <section class="chat-list" aria-label="채팅방 목록">
            <div th:each="myChatRoom : ${myChatRooms}">
            <a class="chat-room-card"
               th:href="@{|/mobile/chat/${myChatRoom.chatRoomId}|}"
               href="/mobile/chat/"
            >
                <img class="chat-room-avatar"
                     th:src="@{/images/chat/partner-lee-jaeyong.png}"
                     src="/images/chat/partner-lee-jaeyong.png"
                     alt="이재용 프로필">
                <div class="chat-room-info">
                    <strong class="chat-room-name" th:text="${myChatRoom.contactUser.name}">이재용</strong>
                    <span class="chat-room-item" th:text="${myChatRoom.listing.title}">갤럭시S26 Ultra 512GB</span>
                    <span class="chat-room-message" th:text="${myChatRoom.lastMessage.content}">지금 바로 챙겨서 나갈게요.</span>
                </div>
                <div class="chat-room-meta" aria-label="오후 2:30, 읽지 않은 메시지 2개">
                    <time datetime="14:30">오후 2:30</time>
                    <span class="chat-room-badge" th:text="${myChatRoom.unReadMessageCount}">2</span>
                </div>
            </a>
            </div>
        </section>

        <nav th:replace="~{fragments/mobile :: bottomNav('chat')}"></nav>
    </section>
</main>
</body>
</html>
