<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - 세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/listing-write.css}" href="/css/listing-write.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen write-screen" aria-labelledby="write-title">
        <header class="write-header">
            <a class="write-back-button" th:href="@{/mobile/main}" href="/mobile/main" aria-label="뒤로가기">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </a>
            <h1 id="write-title">글쓰기</h1>
        </header>

        <form class="write-form" th:action="@{/mobile/listings}" method="post" enctype="multipart/form-data">
            <fieldset class="write-fieldset">
                <legend>거래 종류</legend>
                <label class="trade-option">
                    <input type="radio" name="type" value="SALE" checked>
                    <span class="trade-option-content">
                        <i class="bi bi-bag-check" aria-hidden="true"></i>
                        <span>판매하기</span>
                    </span>
                    <span class="trade-radio" aria-hidden="true"></span>
                </label>
                <label class="trade-option">
                    <input type="radio" name="type" value="GIVEAWAY">
                    <span class="trade-option-content">
                        <i class="bi bi-heart" aria-hidden="true"></i>
                        <span>나눔하기</span>
                    </span>
                    <span class="trade-radio" aria-hidden="true"></span>
                </label>
            </fieldset>

            <div class="write-field">
                <label for="category">카테고리</label>
                <select id="category" name="categoryId" aria-label="카테고리" required>
                    <option value="" disabled selected>카테고리를 선택해주세요</option>
                    <option th:each="category : ${categories}"
                           th:value="${category.id}"
                           th:text="${category.name}">
                        카테고리명
                    </option>
                </select>
            </div>

            <div class="write-field">
                <label for="title">제목</label>
                <input id="title" name="title" type="text" maxlength="50" required placeholder="제목을 입력해주세요(최대 50자)">
            </div>

            <div class="write-field">
                <span class="write-label">상품 이미지</span>
                <button id="imageUploadButton" class="image-upload-box" type="button">
                    <span class="image-upload-plus" aria-hidden="true"></span>
                    <strong id="imageUploadText">사진을 추가하세요</strong>
                    <span class="image-upload-help">(최대 10장, 개당 5MB 이하)</span>
                </button>

                <input id="images" class="image-file-input" name="images" type="file" accept="image/*" multiple>
            </div>

            <div class="write-field">
                <label for="description">상품 설명</label>
                <textarea id="description" name="description" required placeholder="상품에 대해 자세히 설명해주세요."></textarea>
            </div>

            <div class="write-field">
                <label for="price">가격</label>
                <input id="price" name="price" type="number" min="0" required placeholder="가격을 입력해주세요">
            </div>

            <div class="write-action-bar">
                <button id="listingCancelButton" class="write-cancel-button" type="button" th:data-cancel-url="@{/mobile/main}">취소</button>
                <button id="listingSubmitButton" class="write-submit-button" type="submit">등록하기</button>
            </div>
        </form>
    </section>
</main>
<script th:src="@{/js/listing-write.js}" src="/js/listing-write.js"></script>
</body>
</html>
