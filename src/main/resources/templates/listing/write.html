<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글쓰기 - 세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/listing-write.css}" href="/css/listing-write.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen write-screen" aria-labelledby="write-title">
        <header class="write-header">
            <a class="write-back-button" th:href="@{/mobile/main}" href="/mobile/main" aria-label="뒤로가기">
                <i class="bi bi-arrow-left" aria-hidden="true"></i>
            </a>
            <h1 id="write-title">글쓰기</h1>
        </header>

        <form class="write-form" action="#" method="post">
            <fieldset class="write-fieldset">
                <legend>거래 종류</legend>
                <label class="trade-option is-selected">
                    <input type="radio" name="tradeType" value="sale" checked>
                    <span class="trade-option-content">
                        <i class="bi bi-bag-check" aria-hidden="true"></i>
                        <span>판매하기</span>
                    </span>
                    <span class="trade-radio" aria-hidden="true"></span>
                </label>
                <label class="trade-option">
                    <input type="radio" name="tradeType" value="share">
                    <span class="trade-option-content">
                        <i class="bi bi-heart" aria-hidden="true"></i>
                        <span>나눔하기</span>
                    </span>
                    <span class="trade-radio" aria-hidden="true"></span>
                </label>
            </fieldset>

            <div class="write-field">
                <label for="category">카테고리</label>
                <select id="category" name="category" aria-label="카테고리">
                    <option value="">카테고리를 선택해주세요 - select 태그</option>
                    <option value="it">ITㆍ디지털</option>
                    <option value="appliance">가전제품</option>
                    <option value="furniture">가구ㆍ인테리어</option>
                    <option value="living">생활ㆍ주방</option>
                </select>
            </div>

            <div class="write-field">
                <label for="title">제목</label>
                <input id="title" name="title" type="text" maxlength="10" placeholder="제목을 입력해주세요 (최대 10자)">
            </div>

            <div class="write-field">
                <span class="write-label">상품 이미지</span>
                <button class="image-upload-box" type="button">
                    <span class="image-upload-plus" aria-hidden="true"></span>
                    <strong>사진을 추가하세요</strong>
                    <span>(최대 10장, 개당 10MB 이하)</span>
                </button>
            </div>

            <div class="write-field">
                <label for="description">상품 설명</label>
                <textarea id="description" name="description" placeholder="상품에 대해 자세히 설명해주세요."></textarea>
            </div>

            <div class="write-field">
                <label for="price">가격</label>
                <input id="price" name="price" type="text" inputmode="numeric" placeholder="가격을 입력해주세요">
            </div>

            <div class="write-action-bar">
                <button class="write-cancel-button" type="button">취소</button>
                <button class="write-submit-button" type="button">등록하기</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
