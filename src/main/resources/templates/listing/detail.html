<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${listing.title + ' - 세니마켓'}">상품 상세 - 세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/listing-detail.css}" href="/css/listing-detail.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen detail-screen" aria-labelledby="detail-title">
        <header class="detail-banner">
            <h1>나눔은 마음을 이어줍니다</h1>
            <img th:src="@{/images/listing/detail-share-banner.png}"
                 src="/images/listing/detail-share-banner.png"
                 alt="">
        </header>

        <!-- 상품 이미지가 없으면 기본 이미지를 보여준다. -->
        <section class="detail-image-section" aria-label="상품 이미지">
            <img class="detail-main-image"
                 th:src="${!#lists.isEmpty(listing.images) ? listing.images[0].imageUrl : '/images/listing/product-default-img.png'}"
                 src="/images/listing/product-default-img.png"
                 th:alt="${listing.title}"
                 alt="상품 이미지">
            <div class="detail-thumbnails"
                 aria-label="상품 이미지 썸네일"
                 th:if="${!#lists.isEmpty(listing.images)}">
                <img class="detail-thumbnail"
                     th:each="image, imageStat : ${listing.images}"
                     th:classappend="${imageStat.index == 0} ? ' is-active'"
                     th:src="${image.imageUrl}"
                     src="/images/listing/product-default-img.png"
                     th:alt="${listing.title}"
                     alt="상품 썸네일">
            </div>
        </section>

        <!-- 컨트롤러에서 전달한 listing 모델로 상세 정보를 출력한다. -->
        <section class="detail-info" aria-labelledby="detail-title">
            <h2 id="detail-title" th:text="${listing.title}">상품명</h2>
            <strong class="detail-price" th:text="${listing.price + '원'}">0원</strong>

            <dl class="detail-specs">
                <div>
                    <dt>카테고리</dt>
                    <dd th:text="${listing.category.name}">카테고리</dd>
                </div>
                <div>
                    <dt>등록일</dt>
                    <dd th:text="${#temporals.format(listing.createdAt, 'yyyy.MM.dd')}">등록일</dd>
                </div>
                <div>
                    <dt>조회수</dt>
                    <dd th:text="${listing.viewCount}">0</dd>
                </div>
                <div>
                    <dt>관심수</dt>
                    <dd th:text="${listing.likeCount}">0</dd>
                </div>
            </dl>

            <section class="detail-description" aria-labelledby="description-title">
                <h3 id="description-title">상품설명</h3>
                <p th:text="${listing.description}">상품설명</p>
            </section>
        </section>

        <div class="detail-action-bar">
            <a class="detail-list-button" th:href="@{/mobile/main}" href="/mobile/main">목록으로</a>
            <form th:if="${!listing.owner}" th:action="@{/mobile/chat}" method="post" style="display:contents">
                <input type="hidden" name="listingId" th:value="${listing.id}">
                <input type="hidden" name="sellerId" th:value="${listing.seller.id}">
                <button type="submit" class="detail-chat-button">1:1 채팅하기</button>
            </form>
            <a class="detail-chat-button"
               th:if="${listing.owner}"
               th:href="@{/mobile/listings/edit(id=${listing.id})}"
               href="/mobile/listings/edit">수정하기</a>
        </div>
    </section>
</main>
<script th:src="@{/js/listing-detail.js}" src="/js/listing-detail.js"></script>
</body>
</html>
