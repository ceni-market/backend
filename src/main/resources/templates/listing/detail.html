<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맥북 에어 M1 13인치 - 세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/listing-detail.css}" href="/css/listing-detail.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen detail-screen" aria-labelledby="detail-title">
        <header class="detail-banner">
            <h1>나눔은 마음을 이어줍니다</h1>
            <img th:src="@{/images/listing/detail-share-banner.png}"
                 src="/images/listing/detail-share-banner.png"
                 alt="">
        </header>

        <section class="detail-image-section" aria-label="상품 이미지">
            <img class="detail-main-image"
                 th:src="@{/images/listing/detail-macbook-main.png}"
                 src="/images/listing/detail-macbook-main.png"
                 alt="맥북 에어 M1 13인치">
            <div class="detail-thumbnails" aria-label="상품 이미지 썸네일">
                <img th:src="@{/images/listing/detail-macbook-thumb.png}"
                     src="/images/listing/detail-macbook-thumb.png"
                     alt="맥북 썸네일 1">
                <img th:src="@{/images/listing/detail-macbook-thumb.png}"
                     src="/images/listing/detail-macbook-thumb.png"
                     alt="맥북 썸네일 2">
                <img th:src="@{/images/listing/detail-macbook-thumb.png}"
                     src="/images/listing/detail-macbook-thumb.png"
                     alt="맥북 썸네일 3">
            </div>
        </section>

        <section class="detail-info" aria-labelledby="detail-title">
            <h2 id="detail-title">맥북 에어 M1 13인치</h2>
            <strong class="detail-price">650,000원</strong>

            <dl class="detail-specs">
                <div>
                    <dt>카테고리</dt>
                    <dd>ITㆍ디지털</dd>
                </div>
                <div>
                    <dt>등록일</dt>
                    <dd>2026.05.06</dd>
                </div>
                <div>
                    <dt>조회수</dt>
                    <dd>115</dd>
                </div>
                <div>
                    <dt>관심수</dt>
                    <dd>12</dd>
                </div>
            </dl>

            <section class="detail-description" aria-labelledby="description-title">
                <h3 id="description-title">상품설명</h3>
                <p>2021년에 구매한 맥북 에어 M1 13인치 모델입니다. 사용감은 약간 있지만 전체적으로 깨끗한 편이고 성능 문제 전혀 없습니다. 구성품은 충전기, 케이블 포함입니다.</p>
            </section>
        </section>

        <div class="detail-action-bar">
            <a class="detail-list-button" th:href="@{/mobile/main}" href="/mobile/main">목록으로</a>
            <a class="detail-chat-button" th:href="@{/mobile/chat/detail}" href="/mobile/chat/detail">1:1 채팅하기</a>
        </div>
    </section>
</main>
</body>
</html>
