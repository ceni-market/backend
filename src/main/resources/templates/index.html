<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceni Market - Home</title>
    <style>
        /* 기본 레이아웃 설정 */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        /* 헤더 스타일 */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4A90E2;
            cursor: pointer;
        }

        .nav-left, .nav-right {
            display: flex;
            gap: 15px;
        }

        /* 버튼 스타일 */
        .btn {
            padding: 8px 16px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .btn-list {
            background-color: #eee;
            color: #333;
        }

        .btn-list:hover {
            background-color: #ddd;
        }

        .btn-login {
            background-color: transparent;
            color: #4A90E2;
            border-color: #4A90E2;
        }

        .btn-login:hover {
            background-color: #4A90E2;
            color: #fff;
        }

        .btn-signup {
            background-color: #4A90E2;
            color: #fff;
        }

        .btn-signup:hover {
            background-color: #357ABD;
        }

        /* 중앙 메인 콘텐츠 */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #333;
        }
    </style>
</head>
<body>

<header>
    <div class="nav-left">
        <a th:href="@{/test/listing}" class="btn btn-list">거래글 목록 보기</a>
    </div>

    <div class="logo" onclick="location.href='/index'">Ceni Market</div>

    <div class="nav-right">
        <a th:href="@{/test/loginpage}" class="btn btn-login" id="login-btn">로그인</a>
        <a th:href="@{/test/signup}" class="btn btn-signup">회원가입</a>
    </div>
</header>

<main>
    <h1>Ceni Market에 오신 것을 환영합니다!</h1>
    <p>우리 동네 중고 거래의 시작, 여기서 함께하세요.</p>
</main>

<script th:inline="javascript">
    // document.getElementById("login-btn").values = "로그아웃"; - 로그인 시 로그인 버튼을 로그아웃 버튼으로 바꾸려고함.-미완성
</script>

</body>
</html>
