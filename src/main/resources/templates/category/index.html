<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카테고리 - 세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/category.css}" href="/css/category.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen category-screen" aria-labelledby="category-title">
        <header class="category-header">
            <h1 id="category-title">카테고리</h1>
        </header>

        <nav class="category-list" aria-label="카테고리 목록">
            <a class="category-item"
               th:href="@{/mobile/main}">
                <span>전체</span>
                <span class="category-arrow" aria-hidden="true"></span>
            </a>
            <a class = "category-item"
                th:each="category : ${categories}"
                th:href="@{/mobile/main(categoryId=${category.id})}">
                <span th:text="${category.name}">카테고리명</span>
                <span class="category-arrow" aria-hidden="true"></span>
            </a>
        </nav>

        <nav th:replace="~{fragments/mobile :: bottomNav('category')}"></nav>
    </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/notification.js"></script>
</body>
</html>
