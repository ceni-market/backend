<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ceni Market - 로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-radius: 10px; background: white; }
    </style>
</head>
<body>

<div class="login-card">
    <h3 class="text-center mb-4">채팅 시작하기</h3>
    <form id="loginForm">
        <div class="mb-3">
            <label for="email" class="form-label">이메일 주소</label>
            <input type="email" class="form-control" id="email" placeholder="test@example.com" required>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">비밀번호</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">로그인</button>
    </form>
</div>

<script th:inline="javascript">
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        fetch('/test/loginprocess', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email, password: password })
        })
            .then(response => {
                if (!response.ok) throw new Error('로그인 실패!');
                return response.json();
            })
            .then(data => {
                const userData = parseJwt(data.accessToken);
                //서버가 준 토큰과 사용자 정보를 로컬 스토리지에 저장
                localStorage.setItem('accessToken', data.accessToken);
                localStorage.setItem('userEmail', userData.sub);

                alert('로그인 성공!');
                location.href = '/index';
            })
            .catch(error => {
                alert(error.message);
            });
    });

    function parseJwt(token) {
        try {
            //토큰의 Payload만 추출.
            const base64Url = token.split('.')[1];

            //Base64 표준 형식에 맞게 문자 교체
            const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');

            //디코딩 후 JSON 객체로 파싱
            const jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        } catch (e) {
            console.error("토큰 파싱 실패:", e);
            return null;
        }
    }
</script>

</body>
</html>
