<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 정보 - 세니마켓</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/mobile-common.css}" href="/css/mobile-common.css">
    <link rel="stylesheet" th:href="@{/css/mypage.css}" href="/css/mypage.css">
</head>
<body>
<main class="mobile-page">
    <section class="mobile-screen mypage-screen" aria-labelledby="mypage-title">
        <header class="mypage-header">
            <h1 id="mypage-title">내 정보</h1>
        </header>

        <section class="mypage-content" aria-label="내 정보">
            <div class="profile-summary">
                <div class="profile-avatar" aria-hidden="true">
                    <img th:if="${profileImageUrl != null and !#strings.isEmpty(profileImageUrl)}"
                         th:src="${profileImageUrl}">

                    <i th:if="${profileImageUrl == null or #strings.isEmpty(profileImageUrl)}"
                       class="bi bi-person-fill"></i>
                </div>
                <strong th:text="${username ?: '사용자'}"></strong>
                <span th:text="${email ?: '이메일 정보 없음'}"></span>
            </div>

            <div class="mypage-menu" aria-label="계정 메뉴">
                <button class="mypage-menu-item" type="button" id="uploadBtn">
                    <span class="mypage-menu-icon">
                        <i class="bi bi-person" aria-hidden="true"></i>
                    </span>
                    <span class="mypage-menu-text">
                        <strong>프로필 사진 변경</strong>
                        <span>프로필 사진을 변경할 수 있어요.</span>
                    </span>
                </button>

                <form id="imageForm" th:action="@{/mobile/mypage/upload}" method="post" enctype="multipart/form-data" style="display: none;">
                    <input type="file" id="fileInput" name="profileImage" accept="image/*">
                </form>

                <button class="mypage-menu-item" type="button" id="logoutBtn">
                    <span class="mypage-menu-icon logout-icon" aria-hidden="true"></span>
                    <span class="mypage-menu-text">
                        <strong>로그아웃</strong>
                        <span>현재 계정에서 로그아웃합니다.</span>
                    </span>
                </button>

                <button class="mypage-menu-item is-danger" type="button" id="withdrawBtn">
                    <span class="mypage-menu-icon trash-icon" aria-hidden="true"></span>
                    <span class="mypage-menu-text">
                        <strong>회원 탈퇴</strong>
                        <span>탈퇴 시 모든 데이터가 삭제됩니다.</span>
                    </span>
                </button>

                <form id="logoutForm" th:action="@{/mobile/logout}" method="post" style="display: none;"></form>

                <form id="withdrawForm" th:action="@{/mobile/withdraw}" method="post" style="display: none;">
                    <input type="hidden" id="withdrawPassword" name="password">
                </form>

            </div>
        </section>

        <nav th:replace="~{fragments/mobile :: bottomNav('mypage')}"></nav>
    </section>
</main>

<script>
    document.addEventListener('DOMContentLoaded', () => {

        // 💡 [추가] 세션 없이 주소창의 ?error=invalid_password 감지하여 경고창 표시
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('error') === 'invalid_password') {
            alert('비밀번호가 일치하지 않습니다. 다시 확인해 주세요.');

            // 얼럿 확인 후 주소창 뒤의 깔끔함을 위해 ?error=... 파라미터만 제거 (선택 사항)
            history.replaceState({}, null, window.location.pathname);
        }

        // 📷 프로필 사진 변경 버튼 이벤트
        document.getElementById('uploadBtn').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function() {
            if (this.files && this.files.length > 0) {
                document.getElementById('imageForm').submit();
            }
        });

        // 🔓 로그아웃 버튼 클릭 이벤트
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('로그아웃 하시겠습니까?')) {
                document.getElementById('logoutForm').submit();
            }
        });

        // 🚨 회원 탈퇴 버튼 클릭 이벤트
        document.getElementById('withdrawBtn').addEventListener('click', () => {
            const firstCheck = confirm('정말로 회원 탈퇴를 진행하시겠습니까?');
            if (firstCheck) {
                const passwordInput = prompt('⚠️ [중요] 회원 탈퇴 안내\n\n위 사항에 동의하신다면 본인 확인을 위해 비밀번호를 입력해 주세요.');
                if (passwordInput !== null) {
                    if (passwordInput.trim() === '') {
                        alert('비밀번호를 정확히 입력해야 탈퇴가 가능합니다.');
                        return;
                    }
                    document.getElementById('withdrawPassword').value = passwordInput;
                    document.getElementById('withdrawForm').submit();
                }
            }
        });
    });
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/notification.js"></script>
</body>
</html>
