<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세니마켓 로그인</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<main class="login-page">
    <section class="login-screen" aria-labelledby="login-title">
        <img class="login-logo" th:src="@{/images/login/login-logo.png}" src="/images/login/login-logo.png" alt="ITCEN">

        <div class="login-copy">
            <h1 id="login-title">로그인</h1>
            <p>세니마켓에 오신 것을 환영합니다!</p>
        </div>

        <form class="login-form" action="/mobile/login" method="post">
            <label class="login-field">
                <i class="bi bi-person" aria-hidden="true"></i>
                <span class="visually-hidden">이메일</span>
                <input type="email" name="email" placeholder="이메일을 입력하세요" autocomplete="email">
            </label>

            <label class="login-field">
                <i class="bi bi-lock" aria-hidden="true"></i>
                <span class="visually-hidden">비밀번호</span>
                <input type="password" name="password" placeholder="비밀번호를 입력하세요" autocomplete="current-password">
            </label>

            <button class="login-button" type="submit">로그인</button>
        </form>

        <img class="login-illustration"
             th:src="@{/images/login/login-illustration.png}"
             src="/images/login/login-illustration.png"
             alt="">
    </section>
</main>

<script th:if="${param.error}" th:inline="javascript">
    window.alert("이메일 또는 비밀번호가 올바르지 않습니다.");
</script>
</body>
</html>
