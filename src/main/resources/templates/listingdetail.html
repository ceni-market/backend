<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ceni Market - [[${listing.title}]]</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; background-color: #fff; color: #333; }

        /* 헤더 유지 */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 2rem; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .logo { font-size: 1.5rem; font-weight: bold; color: #4A90E2; cursor: pointer; }
        .btn { padding: 8px 16px; border-radius: 5px; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }

        /* 메인 컨테이너 */
        .container {
            max-width: 1000px; margin: 40px auto; padding: 0 20px;
        }

        /* 상단 영역 (사진 & 주요 정보) */
        .post-top {
            display: flex; gap: 40px; margin-bottom: 40px;
        }

        /* 왼쪽: 이미지 슬라이더 영역 */
        .image-section {
            flex: 1; position: relative; max-width: 450px;
        }
        .image-viewer {
            width: 100%; aspect-ratio: 1/1; background-color: #f4f4f9;
            border-radius: 12px; overflow: hidden; position: relative;
        }
        .image-viewer img {
            width: 100%; height: 100%; object-fit: cover;
        }
        /* 슬라이더 버튼 */
        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0,0,0,0.3); color: white; border: none;
            width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
        }
        .prev { left: 10px; }
        .next { right: 10px; }

        /* 오른쪽: 상품 정보 영역 */
        .info-section {
            flex: 1; display: flex; flex-direction: column;
        }
        .title { font-size: 2rem; font-weight: bold; margin-bottom: 10px; }
        .seller { font-size: 0.9rem; color: #666; margin-bottom: 20px; }
        .price { font-size: 1.8rem; font-weight: 800; color: #333; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }

        .btn-chat {
            width: 100%; padding: 18px; background-color: #4A90E2; color: white;
            border: none; border-radius: 8px; font-size: 1.2rem; font-weight: bold;
            cursor: pointer; transition: background 0.3s;
        }
        .btn-chat:hover { background-color: #357ABD; }

        /* 하단: 상세 설명 영역 */
        .description-section {
            border-top: 2px solid #f4f4f9; padding-top: 30px; line-height: 1.6;
        }
        .description-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #4A90E2; }
        .content { white-space: pre-wrap; font-size: 1.1rem; color: #444; }
    </style>
</head>
<body>

<header>
    <div class="nav-left"><a th:href="@{/test/listing}" class="btn" style="background:#eee;">목록으로</a></div>
    <div class="logo" onclick="location.href='/index'">Ceni Market</div>
    <div class="nav-right">
        <a th:href="@{/loginpage}" class="btn" style="border: 1px solid #4A90E2; color: #4A90E2;">로그인</a>
    </div>
</header>

<div class="container">
    <div class="post-top">
        <div class="image-section">
            <div class="image-viewer" id="imageViewer">
                <img th:src="${'/images/default.png'}" id="currentImg">
                <button class="slider-btn prev" onclick="prevImg()">&lt;</button>
                <button class="slider-btn next" onclick="nextImg()">&gt;</button>
            </div>
        </div>

        <div class="info-section">
            <div class="title" th:text="${listing.title}">상품 제목이 나옵니다.</div>
            <div class="seller">판매자: <span th:text="${listing.seller.name}">두강현</span></div>

            <div class="price">
                <span th:if="${listing.type.name() == 'GIVEAWAY'}" style="color: #28a745;">무료나눔 🎁</span>
                <span th:unless="${listing.type.name() == 'GIVEAWAY'}"
                      th:text="${#numbers.formatInteger(listing.price, 0, 'COMMA')} + '원'">30,000원</span>
            </div>
            <form method="post">
                <input type="hidden" name="listingId" th:value="${listing.id}">
                <input type="hidden" name="sellerId" th:value="${listing.seller.id}">
                <button class="btn-chat" type="button" th:onclick="createChatRoom()">판매자와 채팅하기</button>
            </form>
        </div>
    </div>

    <div class="description-section">
        <div class="description-title">상세 정보</div>
        <div class="description" th:text="${listing.description}">
            여기에 상품에 대한 상세한 설명이 들어갑니다.
            JPA에서 긁어온 description 데이터가 출력되는 곳입니다.
        </div>
    </div>
</div>

<script th:inline="javascript">
    /* 형이 만든 DTO에 이미지 리스트가 있다면 아래와 같이 배열로 받아 처리할 수 있습니다.
       지금은 단일 imageUrl 기반으로 작성되었습니다.
    */

    let currentIndex = 0;
    const imgElement = document.getElementById('currentImg');

    function updateImage() {
        if(images[currentIndex]) {
            imgElement.src = images[currentIndex];
        }
    }

    function prevImg() {
        if (currentIndex > 0) {
            currentIndex--;
            updateImage();
        }
    }

    function nextImg() {
        if (currentIndex < images.length - 1) {
            currentIndex++;
            updateImage();
        }
    }

    function createChatRoom() {
        // 1. LocalStorage에서 토큰 가져오기
        const token = localStorage.getItem('accessToken'); // 팀에서 정한 키 이름 확인
        const buyerEmail = localStorage.getItem('userEmail');

        if (!token) {
            alert("로그인이 필요합니다.");
            location.href = "/login";
            return;
        }

        // 2. 전송할 데이터 준비
        const data = {
            listingId: [[${listing.id}]],
            sellerId: [[${listing.seller.id}]],
            buyerEmail: buyerEmail
        };

        // 3. Fetch API로 요청 전송
        fetch('/chat/create', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify(data)
        })
            .then(response => {
                if (response.ok) {
                    return response.json();
                }
                throw new Error('채팅방 생성 실패');
            })
            .then(result => {
                console.log("ddd", result);
                // 성공 시 생성된 채팅방으로 이동
                location.href = '/chat/' + result.chatRoomId;
            })
            .catch(error => alert(error.message));
    }
</script>

</body>
</html>
