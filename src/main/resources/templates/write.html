<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ceni Market - 글쓰기</title>
    <style>
        /* (기존 스타일 유지) */
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; background-color: #f9f9f9; color: #333; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background-color: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 1.5rem; font-weight: bold; color: #4A90E2; cursor: pointer; }
        .btn { padding: 8px 16px; border-radius: 5px; text-decoration: none; font-size: 0.9rem; transition: 0.3s; border: none; cursor: pointer; }

        /* 폼 컨테이너 */
        .form-container { max-width: 700px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { margin-top: 0; color: #333; border-bottom: 2px solid #f4f4f9; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; }
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }

        /* --- [여기서부터 수정/추가된 이미지 업로드 스타일] --- */
        .upload-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 드래그 앤 드롭 박스 */
        .upload-box {
            width: 100%;
            height: 120px;
            border: 2px dashed #4A90E2;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #4A90E2;
            cursor: pointer;
            transition: background 0.3s, border-color 0.3s;
            background-color: #fbfdff;
        }

        .upload-box:hover {
            background-color: #f0f8ff;
        }

        .upload-box.dragover {
            background-color: #e3f2fd;
            border-color: #1565c0;
        }

        .upload-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        /* 미리보기 컨테이너 (그리드 포맷) */
        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        /* 미리보기 개별 아이템 스타일 */
        .preview-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .preview-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 이미지가 꽉 차게 */
        }

        /* 삭제 버튼 (X) */
        .btn-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .btn-remove:hover { background: rgba(0,0,0,0.8); }

        /* --- [여기까지 수정된 스타일] --- */

        /* 등록 버튼 */
        .btn-submit { width: 100%; padding: 15px; background-color: #4A90E2; color: white; font-size: 1.1rem; font-weight: bold; border-radius: 6px; margin-top: 10px; }
        .btn-submit:hover { background-color: #357ABD; }
    </style>
</head>
<body>

<header>
    <div class="nav-left"><a th:href="@{/test/listing}" class="btn" style="background:#eee;">취소</a></div>
    <div class="logo" onclick="location.href='/index'">Ceni Market</div>
    <div class="nav-right"><span style="font-weight: bold; color: #4A90E2;">[[${username}]]님</span></div>
</header>

<div class="form-container">
    <h2>거래글 쓰기</h2>
    <form action="/test/listing/new" method="post">
        <input type="hidden" name="sellerEmail" id="sellerEmail">
        <script>
            const sellerId = document.getElementById("sellerEmail");
            sellerId.value = localStorage.getItem("userEmail");
            console.log(localStorage.getItem("userEmail"));
        </script>
        <div class="form-group">
            <label>거래 방식</label>
            <select name="type" id="tradeType">
                <option value="SALE">판매하기 (Sale)</option>
                <option value="GIVEAWAY">나눔하기 (Giveaway)</option>
            </select>
        </div>
        <div class="form-group">
            <label>글 제목</label>
            <input type="text" name="title" placeholder="제목을 입력하세요" required>
        </div>
        <div class="form-group">
            <label>가격 (₩)</label>
            <input type="number" name="price" id="priceInput" placeholder="가격을 입력하세요" required>
        </div>
        <div class="form-group">
            <label>카테고리</label>
            <select name="categoryId">
                <option value="1">키보드</option>
                <option value="2">마우스</option>
                <option value="3">노트북</option>
            </select>
        </div>

        <div class="form-group">
            <label>상품 이미지 (최대 5장)</label>
            <div class="upload-area">
                <input type="file" id="fileInput" name="imageUrls" multiple accept="image/*" style="display: none;">

                <div class="upload-box" id="dropZone">
                    <div class="upload-icon">📸</div>
                    <span>이미지를 드래그하거나 클릭</span>
                </div>

                <div class="preview-container" id="previewContainer"></div>
            </div>
        </div>
        <div class="form-group">
            <label>상세 설명</label>
            <textarea name="description" rows="8" placeholder="구매자에게 필요한 정보를 상세히 적어주세요. (상태, 구매 시기 등)"></textarea>
        </div>
        <button type="submit" class="btn btn-submit">등록하기</button>
    </form>
</div>

<script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('previewContainer');
    const tradeType = document.getElementById('tradeType');
    const priceInput = document.getElementById('priceInput');



    // (가격 비활성화 로직 유지)
    tradeType.addEventListener('change', (e) => {
        if (e.target.value === 'GIVEAWAY') { priceInput.value = 0; priceInput.readOnly = true; priceInput.style.backgroundColor = '#f0f0f0';
        } else { priceInput.readOnly = false; priceInput.style.backgroundColor = 'white'; }
    });

    // 1. 클릭 시 파일 선택창 열기
    dropZone.addEventListener('click', () => fileInput.click());

    // 2. 파일 Input 값 변경 시 처리
    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    // 3. 드래그 앤 드롭 효과 및 처리
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
    });

    // 4. 핵심: 파일 처리 및 미리보기 생성 함수
    function handleFiles(files) {
        // 이미 업로드된 파일 개수 확인 (예: 최대 5장 제한)
        const currentFiles = previewContainer.querySelectorAll('.preview-item').length;
        if (currentFiles + files.length > 5) {
            alert('이미지는 최대 5장까지 업로드 가능합니다.');
            return;
        }

        for (const file of files) {
            // 이미지 파일만 처리
            if (!file.type.startsWith('image/')) {
                alert('이미지 파일만 업로드 가능합니다.');
                continue;
            }

            // FileReader를 이용해 로컬 파일 읽기
            const reader = new FileReader();
            reader.onload = (e) => {
                // 미리보기 아이템 래퍼(div) 생성
                const previewItem = document.createElement('div');
                previewItem.classList.add('preview-item');

                // 실제 이미지 생성
                const img = document.createElement('img');
                img.src = e.target.result; // 읽어온 파일 데이터(DataURL)
                img.classList.add('preview-img');

                // 삭제 버튼 (X) 생성
                const removeBtn = document.createElement('button');
                removeBtn.innerText = 'X';
                removeBtn.classList.add('btn-remove');
                removeBtn.onclick = (e) => {
                    e.stopPropagation(); // 부모 클릭 이벤트 전파 방지
                    previewItem.remove(); // 미리보기 아이템 삭제
                    // (실제 파일 서버 전송용 input 관리 로직은 여기에 추가 필요)
                };

                // 조립 및 화면 출력
                previewItem.appendChild(img);
                previewItem.appendChild(removeBtn);
                previewContainer.appendChild(previewItem);
            };
            reader.readAsDataURL(file); // DataURL 형식으로 파일 읽기 시작
        }
    }
</script>
</body>
</html>
