spring:
  application:
    name: ceni-market-backend

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ceni_market?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: jdbctest
    password: jdbctest

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

server:
  port: 8088

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace